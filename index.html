<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Startups Directory</title>
    <link rel="stylesheet" href="style.css">
    <!-- Official Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>Top Startups Directory</h1>
        <p>A curated list of high-growth companies with real-time news mentions.</p>
        <a href="https://forms.gle/qksnBJHmJhoY1KWq8" target="_blank" class="submit-startup-btn">Submit a Startup</a>
    </header>

    <main>
        <!-- Search and Filters Section -->
        <section class="filters-container">
            <input type="text" id="search-input" placeholder="Search startups, founders, or descriptions...">
            
            <select id="sector-filter">
                <option value="">All Sectors</option>
            </select>

            <select id="city-filter">
                <option value="">All Cities</option>
            </select>
        </section>

        <!-- Dynamic Startup Cards Grid -->
        <section id="directory-grid" class="grid-container">
            <div class="loading-state">Loading startups from database...</div>
        </section>
    </main>

    <footer>
        <p>© 2026 Top Startups Directory. Powered by Supabase & Google News RSS.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
